name: Check

on:
  pull_request:
    paths-ignore:
      - "*.md"

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [ggdb7_ubuntu]
    env:
      GGDB_IMAGE: ghcr.io/greengagedb/greengage/${{ matrix.image }}:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, Install and Test
        run: |
          set -eux
          docker run \
            --volume ./logs:/logs \
            --volume ./:/home/gpadmin/pg_cron \
            --sysctl "kernel.sem=500 1024000 200 4096" \
            $GGDB_IMAGE \
            bash -c "pg_cron/ci/install.bash && su gpadmin -c 'pg_cron/ci/test.bash'"

      - name: Collect logs
        if: always()
        uses: greengagedb/greengage-ci/.github/actions/collect-logs@v55
        with:
          params: |
            gpAdminLogs d gpAdminLogs
            gpdb_src/gpAux/gpdemo/datadirs d *log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg_cron_${{ matrix.image }}_logs
          path: logs
